# PostgreSQL. Versions 9.5 and up are supported.
#
# Production uses a single Render Postgres instance for the primary app,
# Solid Cache, Solid Queue, and Solid Cable (same DATABASE_URL).

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: end_times_development

test:
  <<: *default
  database: end_times_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate
