# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour

default: &default
  ingest_news:
    class: IngestNewsJob
    queue: default
    schedule: every 20 minutes
  select_stories:
    class: SelectStoriesJob
    queue: default
    schedule: every hour

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
